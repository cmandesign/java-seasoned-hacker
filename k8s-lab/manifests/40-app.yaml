# The vulnerable Spring Boot application (the internet-facing entry point).
# It exposes the stacked-query SQL injection sink at:
#   GET /api/v1/lab/products?search=...
# which the attacker uses to reach PostgreSQL as a superuser (see 20-postgres.yaml).
#
# Image `vuln-lab/owasp-app:latest` is built from this repo and imported into k3s
# by scripts/build-and-import.sh (imagePullPolicy: Never -> use the local image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owasp-app
  namespace: vuln-lab
  labels:
    app: owasp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: owasp-app
  template:
    metadata:
      labels:
        app: owasp-app
    spec:
      # The app pod itself does NOT need a token; only the Postgres pod is the
      # intentionally over-privileged one. Turning this off here keeps the lab's
      # single escalation path unambiguous.
      automountServiceAccountToken: false
      containers:
        - name: owasp-app
          image: vuln-lab/owasp-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8slab"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.vuln-lab.svc.cluster.local:5432/owaspdb"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_REDIS_HOST
              value: "redis.vuln-lab.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: owasp-app
  namespace: vuln-lab
spec:
  type: NodePort
  selector:
    app: owasp-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
