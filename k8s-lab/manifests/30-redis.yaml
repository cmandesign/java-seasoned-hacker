# Redis is a supporting dependency of the demo app (OTP / login cache features).
# It plays no role in the attack chain; it is here only so every app endpoint works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vuln-lab
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vuln-lab
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
